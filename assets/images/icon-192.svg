<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31013F"/>
      <stop offset="100%" stop-color="#240030"/>
    </linearGradient>
    <linearGradient id="mainSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#f6ca65"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo morado oscuro con esquinas redondeadas -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  
  <!-- Brillo principal dorado de 4 puntas -->
  <path d="M96 34 C96 68 114 86 148 96 C114 106 96 124 96 158 C96 124 78 106 44 96 C78 86 96 68 96 34 Z" fill="url(#mainSparkleGrad)" filter="url(#softGlow)"/>
  
  <!-- Brillo blanco superior derecho -->
  <path d="M140 46 C140 56 145 61 155 66 C145 71 140 76 140 86 C140 76 135 71 125 66 C135 61 140 56 140 46 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Punto de brillo inferior izquierdo -->
  <circle cx="54" cy="138" r="6.5" fill="#f6ca65" opacity="0.85"/>
</svg>

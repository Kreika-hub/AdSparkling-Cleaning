<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31013F"/>
      <stop offset="100%" stop-color="#240030"/>
    </linearGradient>
    <linearGradient id="mainSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#f6ca65"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>
    <filter id="softGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Fondo morado oscuro con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Brillo principal dorado de 4 puntas -->
  <path d="M256 90 C256 182 304 230 396 256 C304 282 256 330 256 422 C256 330 208 282 116 256 C208 230 256 182 256 90 Z" fill="url(#mainSparkleGrad)" filter="url(#softGlow512)"/>
  
  <!-- Brillo blanco superior derecho -->
  <path d="M374 122 C374 150 388 164 416 176 C388 188 374 202 374 230 C374 202 360 188 332 176 C360 164 374 150 374 122 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Punto de brillo inferior izquierdo -->
  <circle cx="144" cy="368" r="17" fill="#f6ca65" opacity="0.85"/>
</svg>
